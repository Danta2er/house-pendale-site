<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Form definitions</title></head>
<body>
  <form name="newsletter-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="newsletter-interest">
    <input name="email" type="email">
    <input name="subject" type="hidden" value="House Pendale — newsletter interest">
    <input name="bot-field">
  </form>
  <form name="contact-house-pendale" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact-house-pendale">
    <input name="name" type="text">
    <input name="email" type="email">
    <input name="topic" type="text">
    <textarea name="message"></textarea>
    <input name="subject" type="hidden" value="House Pendale — contact form">
    <input name="bot-field">
  </form>
</body>
</html>
